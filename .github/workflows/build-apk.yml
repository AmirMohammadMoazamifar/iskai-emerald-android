name: Build Iskai Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Find and extract project ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "No project ZIP found!"; exit 1
        fi
        mkdir -p "$GITHUB_WORKSPACE/project"
        unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"
        
        SETTINGS=$(find "$GITHUB_WORKSPACE/project" -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS" ]; then
          echo "Could not find settings.gradle"; exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Build debug APK
      run: |
        cd "$PROJECT_DIR"
        
        # If Gradle Wrapper is missing, generate it (requires gradle command)
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper not found. Generating a temporary one..."
          gradle wrapper --gradle-version 8.7
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Iskai-Emerald-Android-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
